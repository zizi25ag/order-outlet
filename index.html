<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sistem Order & Pengadaan Outlet</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <iframe src="https://script.google.com/macros/s/AKfycby-3CRQIFPxQBCARK1ZcT6aDCs1I6U5rBDICi4qL6rUp-TR72s49_iR7p483hy5vQD-/exec" allow="web-share; clipboard-write; camera; microphone; geolocation"></iframe>

  <script>
    window.addEventListener('message', function(event) {
      if (event.data && event.data.type === 'SHARE_WA_IMAGE') {
        if (window.AndroidBridge && typeof window.AndroidBridge.shareImageAndText === 'function') {
          window.AndroidBridge.shareImageAndText(event.data.image, event.data.text);
        }
      }
    });
  </script>

</body>
</html>
